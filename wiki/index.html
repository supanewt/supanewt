<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Character dossier for Sir Aldren Vey, a selectable starting protagonist in a plague-ravaged horror strategy RPG.">
  <title>Sir Aldren Vey — The Templar</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div data-include="header.html"></div>
  <div data-include="body.html"></div>
  <div data-include="footer.html"></div>
  <script>
    document.querySelectorAll('[data-include]').forEach(async (container) => {
      const file = container.getAttribute('data-include');
      try {
        const response = await fetch(file);
        if (!response.ok) throw new Error('Unable to load ' + file);
        container.outerHTML = await response.text();
      } catch (error) {
        container.innerHTML = '<p style="padding:24px;text-align:center">This section could not be loaded.</p>';
        console.error(error);
      }
    });
  </script>
</body>
</html>
